# Production stack for the VPS. The Hono API is mounted inside Next, so the web
# container serves both UI and /api on one port. Ports avoid the BTC dashboard
# (3000/5050): EREBUS uses 4000 (web+api), 5433 (pg), 6380 (redis).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: erebus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erebus
      POSTGRES_USER: erebus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erebus_prod}
    ports:
      - "5433:5432"
    volumes:
      - erebus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erebus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erebus]

  redis:
    image: redis:7-alpine
    container_name: erebus-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - erebus_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erebus]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: erebus-web
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erebus:${POSTGRES_PASSWORD:-erebus_prod}@postgres:5432/erebus
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPUS_MODEL: ${OPUS_MODEL:-claude-opus-4-8}
      SONNET_MODEL: ${SONNET_MODEL:-claude-sonnet-4-6}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-offline}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EREBUS_USER: ${EREBUS_USER:-erebus}
      EREBUS_PASS: ${EREBUS_PASS}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [erebus]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: erebus-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erebus:${POSTGRES_PASSWORD:-erebus_prod}@postgres:5432/erebus
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPUS_MODEL: ${OPUS_MODEL:-claude-opus-4-8}
      SONNET_MODEL: ${SONNET_MODEL:-claude-sonnet-4-6}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-offline}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEWS_SOURCES: ${NEWS_SOURCES:-}
      CYCLE_BUDGET_USD: ${CYCLE_BUDGET_USD:-2.00}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-15}
      MAX_DEPTH: ${MAX_DEPTH:-8}
      INGEST_EVERY_MIN: ${INGEST_EVERY_MIN:-30}
      CYCLE_EVERY_MIN: ${CYCLE_EVERY_MIN:-60}
      GARDEN_EVERY_MIN: ${GARDEN_EVERY_MIN:-720}
      WORLDVIEW_EVERY_MIN: ${WORLDVIEW_EVERY_MIN:-1440}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [erebus]

volumes:
  erebus_pgdata:
  erebus_redis:

networks:
  erebus:
    driver: bridge
