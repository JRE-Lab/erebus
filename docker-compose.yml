# Dev infra only: Postgres (pgvector) + Redis.
# Run the app with `pnpm dev` against these.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: erebus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erebus
      POSTGRES_USER: erebus
      POSTGRES_PASSWORD: erebus
    ports:
      - "5432:5432"
    volumes:
      - erebus_pgdata:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erebus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erebus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - erebus_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  erebus_pgdata:
  erebus_redis:
